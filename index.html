<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Coin Catalog</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f5f5f5; color: #1a1a1a; padding: 20px; line-height: 1.5;
  }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #666; margin-bottom: 16px; }
  .catalog-header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .catalog-header input, .catalog-header select {
    padding: 8px 12px; border-radius: 8px; border: 1px solid #ddd;
    background: #fff; font-size: 14px; min-width: 160px;
  }
  .catalog-header input { flex: 1; min-width: 200px; }
  .silver-toggle {
    display: flex; align-items: center; gap: 6px; font-size: 14px;
    color: #555; cursor: pointer; user-select: none;
    padding: 8px 12px; border-radius: 8px; border: 1px solid #ddd; background: #fff;
  }
  .silver-toggle input { width: 16px; height: 16px; }
  .stats-bar {
    display: flex; gap: 14px; font-size: 12px; color: #888;
    margin-bottom: 12px; flex-wrap: wrap;
  }
  .coin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .coin-card {
    border: 1px solid #e0e0e0; border-radius: 10px; padding: 14px 16px;
    background: #fff; transition: transform .15s ease, box-shadow .15s ease;
  }
  .coin-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.08); }
  .coin-card.silver { border-left: 3px solid #0066cc; }
  .coin-rank {
    float: right; font-size: 11px; font-weight: 600; color: #bbb;
    font-variant-numeric: tabular-nums;
  }
  .coin-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
  .coin-name { font-size: 15px; font-weight: 600; color: #1a1a1a; }
  .coin-year { font-size: 13px; color: #999; }
  .coin-country { font-size: 12px; color: #666; margin-bottom: 6px; }
  .coin-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .coin-tag {
    font-size: 11px; padding: 2px 8px; border-radius: 5px;
    background: #f0f0f0; color: #555; white-space: nowrap;
  }
  .coin-tag.silver-tag { background: #e6f0ff; color: #0066cc; }
  .coin-value { font-size: 14px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
  .coin-mintage { font-size: 11px; color: #999; }
  .coin-note { font-size: 11px; color: #aaa; margin-top: 4px; }
  .empty-state { text-align: center; padding: 40px; color: #aaa; font-size: 14px; }
  .sort-btn {
    padding: 8px 12px; border-radius: 8px; border: 1px solid #ddd;
    background: #fff; color: #555; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .sort-btn.active { border-color: #1a1a1a; color: #1a1a1a; font-weight: 500; }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1a1a; color: #eee; }
    .coin-card { background: #2a2a2a; border-color: #444; }
    .coin-tag { background: #3a3a3a; color: #ccc; }
    .coin-tag.silver-tag { background: #1a3a5c; color: #88bbff; }
    input, select, .sort-btn, .silver-toggle { background: #2a2a2a; border-color: #444; color: #eee; }
    .coin-name { color: #eee; }
    .coin-value { color: #eee; }
  }
</style>
<base target="_blank">
</head>
<body>

<div class="subtitle">66 coins from 22 countries · 1789–1989 · Searchable collection</div>

<div class="catalog-header">
  <input type="text" id="searchInput" placeholder="Search coin, country, year, material, mintage...">
  <select id="countryFilter"><option value="">All countries</option></select>
  <label class="silver-toggle"><input type="checkbox" id="silverOnly"> Silver only</label>
  <button class="sort-btn active" data-sort="value" onclick="setSort('value')">Most valuable</button>
  <button class="sort-btn" data-sort="year" onclick="setSort('year')">Oldest first</button>
  <button class="sort-btn" data-sort="country" onclick="setSort('country')">Country A–Z</button>
  <button class="sort-btn" data-sort="id" onclick="setSort('id')">Coin #</button>
</div>
<div class="stats-bar" id="statsBar"></div>
<div class="coin-grid" id="coinGrid"></div>

  {id:60,name:"20 Drachmas",year:1988,country:"Greece",material:"Copper-Nickel",value:"$0.50–$2",sortVal:2,mint:"Athens",silver:false,mintage:"Not recorded"},

  {id:63,name:"2 Rand",year:1989,country:"South Africa",material:"Ni-plated Cu",value:"$0.50–$2",sortVal:2,mint:"Pretoria",silver:false,mintage:"Not recorded"},
  {id:64,name:"1 Forint",year:1989,country:"Hungary",material:"Aluminium",value:"$0.10–$0.50",sortVal:0.5,mint:"Budapest",silver:false,mintage:"Not recorded"},

const expanded = [];
coins.forEach(c => {
  if (c.note && c.note.includes("×3")) {
    for (let i = 0; i < 3; i++) {
      expanded.push({...c, note: i === 0 ? "3 identical coins" : undefined});
    }
  } else {
    expanded.push(c);
  }
});

let currentSort = 'value';
let sortDir = -1;

function populateCountries() {
  const sel = document.getElementById('countryFilter');
  const countries = [...new Set(expanded.map(c => c.country))].sort();
  countries.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  });
}

function render() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const country = document.getElementById('countryFilter').value;
  const silverOnly = document.getElementById('silverOnly').checked;

  let filtered = expanded.filter(c => {
    const matchesQ = !q || c.name.toLowerCase().includes(q) || c.country.toLowerCase().includes(q) || String(c.year).includes(q) || c.material.toLowerCase().includes(q) || c.mint.toLowerCase().includes(q) || c.mintage.toLowerCase().includes(q);
    const matchesCountry = !country || c.country === country;
    const matchesSilver = !silverOnly || c.silver;
    return matchesQ && matchesCountry && matchesSilver;
  });

  filtered.sort((a,b) => {
    if (currentSort === 'value') return (b.sortVal - a.sortVal) * sortDir;
    if (currentSort === 'year') return (a.year - b.year) * sortDir;
    if (currentSort === 'country') return a.country.localeCompare(b.country) * sortDir;
    return (a.id - b.id) * sortDir;
  });

  const grid = document.getElementById('coinGrid');
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state">No coins match your search.</div>';
  } else {
    grid.innerHTML = filtered.map((c, idx) => `
      <div class="coin-card ${c.silver ? 'silver' : ''}">
        <div class="coin-rank">#${c.id}</div>
        <div class="coin-top">
          <span class="coin-name">${c.name}</span>
          <span class="coin-year">${c.year}</span>
        </div>
        <div class="coin-country">${c.country} · ${c.mint}</div>
        <div class="coin-meta">
          <span class="coin-tag ${c.silver ? 'silver-tag' : ''}">${c.material}</span>
          ${c.note ? `<span class="coin-tag">${c.note}</span>` : ''}
        </div>
        <div class="coin-value">${c.value}</div>
        <div class="coin-mintage">Mintage: ${c.mintage}</div>
      </div>
    `).join('');
  }

  const stats = document.getElementById('statsBar');
  stats.innerHTML = `
    <span>Showing ${filtered.length} coin${filtered.length!==1?'s':''}</span>
    <span>·</span>
    <span>${expanded.filter(c=>c.silver).length} silver</span>
    <span>·</span>
    <span>${new Set(expanded.map(c=>c.country)).size} countries</span>
    <span>·</span>
    <span>${Math.min(...expanded.map(c=>c.year))}–${Math.max(...expanded.map(c=>c.year))}</span>
  `;
}

function setSort(key) {
  if (currentSort === key) sortDir *= -1;
  else { currentSort = key; sortDir = key === 'value' ? -1 : 1; }
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === key));
  render();
}

document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('countryFilter').addEventListener('change', render);
document.getElementById('silverOnly').addEventListener('change', render);

populateCountries();
render();
</script>
</body>
</html>
